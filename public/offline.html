<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f97316" />
    <title>Connection required - Jalanea ATS</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0f0f1a;
        color: #eef2ff;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        box-sizing: border-box;
        background: linear-gradient(180deg, #0f0f1a, #1a1333);
      }

      main {
        width: min(100%, 34rem);
        padding: 2rem;
        border: 1px solid rgb(99 102 241 / 0.35);
        border-radius: 1.5rem;
        background: rgb(30 27 75 / 0.6);
        box-shadow: 0 1.5rem 4rem rgb(0 0 0 / 0.3);
        text-align: center;
      }

      .mark {
        width: 4rem;
        height: 4rem;
        margin: 0 auto 1.25rem;
        border-radius: 1.25rem;
        background: linear-gradient(135deg, #f97316, #ec4899, #a855f7);
        display: grid;
        place-items: center;
        font-size: 2rem;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.75rem, 6vw, 2.5rem);
      }

      p {
        margin: 1rem auto 0;
        max-width: 28rem;
        color: #c7d2fe;
        line-height: 1.7;
      }

      a {
        margin-top: 1.5rem;
        min-height: 3rem;
        padding: 0.75rem 1.25rem;
        border: 0;
        border-radius: 0.75rem;
        background: #f97316;
        color: #111827;
        font: inherit;
        font-weight: 700;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
      }

      a:focus-visible {
        outline: 3px solid #67e8f9;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">✦</div>
      <h1>Reconnect to continue</h1>
      <p>
        Jalanea ATS is installed, but resume analysis and account features
        require a network connection. Your local files have not been uploaded
        by this offline page.
      </p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
